[project]
name = "p4blo"
version = "0.0.0"
description = "P4's semantic core as an IR, architecture-free"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
# Pure Python only: no dependency here may ship native code. See docs/design.md.
dependencies = [
    "protobuf>=7.36,<8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.14",
    "pyright>=1.1",
    "pytest-xdist>=3",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "impl/python"

[tool.pytest.ini_options]
testpaths = ["impl/python/tests", "tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = ["."]
markers = [
    "lean: requires the built Lean executable through lean_binary",
    "spectec: requires the pinned P4-SpecTec checkout, simulator or export/coverage tools",
    "bmv2: requires Docker and the pinned BMv2 image",
    "p4c: compiles printed P4 with the pinned p4c Docker image",
    "oracle: union of spectec, bmv2 and p4c dependencies; derived by conftest.py",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    "impl/python/p4blo/v0",  # generated code
    "impl/python/p4blo/arch/v0",  # generated architecture bindings
    ".claude",  # worktrees
    ".agents",  # agent notes and campaign recipes
    "impl/python/tests/edsl/typing",  # pyright fixtures, some of which must fail
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["p4blo", "tests"]

[tool.pyright]
include = ["impl/python", "tests", "examples", "spec/arch/P4bloArchTest/fixtures/witnesses.py"]
exclude = ["impl/python/p4blo/v0", "impl/python/p4blo/arch/v0", "impl/python/tests/edsl/typing"]  # impl/python/tests/edsl/test_typing.py runs the fixtures itself
pythonVersion = "3.13"
typeCheckingMode = "standard"
