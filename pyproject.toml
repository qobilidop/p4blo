[project]
name = "p4blo"
version = "0.0.0"
description = "P4's semantic core as an IR, architecture-free"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
# Pure Python only: no dependency here may ship native code. See docs/design.md.
dependencies = [
    "protobuf>=7.36,<8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.14",
    "pyright>=1.1",
    "pytest-xdist>=3",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "impl/python"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: drives the P4-SpecTec simulator or BMv2; the oracle workflows run these, the local gate deselects them",
    "xdist_group: pytest-xdist's group marker, set by conftest.py for modules with an expensive module fixture",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    "impl/python/p4blo/v0",  # generated code
    "impl/python/p4blo/arch/v0",  # generated architecture bindings
    ".claude",  # worktrees
    ".agents",  # agent notes and campaign recipes
    "tests/pyright",  # pyright fixtures, some of which must fail
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["p4blo"]

[tool.pyright]
include = ["impl/python", "tests", "examples", "spec/arch/P4bloArchTest/fixtures/witnesses.py"]
exclude = ["impl/python/p4blo/v0", "impl/python/p4blo/arch/v0", "tests/pyright"]  # tests/unit/test_pyright.py runs the fixtures itself
pythonVersion = "3.13"
typeCheckingMode = "standard"
