// p4blo v0: P4's semantic core as an IR, architecture-free.
//
// This file is the normative syntax of the IR. It is post-elaboration: every
// width is resolved, every name is resolved, there are no generics, no
// arbitrary-precision int, no implicit casts, no tuples. The meaning of a
// program is given by the Lean interpreter under lean/, with the closed
// behaviors listed in docs/semantics.md.
//
// Names. Declarations are referenced by name, as in ONNX, so that the text
// format reads like the program it encodes. Names are resolved, never
// looked up dynamically: the validator checks that every reference names
// exactly one declaration visible from where it stands. The scopes are P4's:
//   - program: header, struct, enum and extern types, extern instances and
//     blocks share one namespace;
//   - block: params, locals, actions, tables and states share one
//     namespace and may not reuse a program-level name;
//   - action: params may not reuse a name of the enclosing block;
//   - a type's fields, an enum's members, the error list and an extern's
//     methods each have their own namespace.
//
// Contract. What the schema cannot express, the validator enforces:
//   - every name is non-empty, unique in its scope, and every reference
//     resolves to a declaration of the expected kind;
//   - the program typechecks: operand widths agree, casts are among the
//     allowed pairs, lvalues are assignable, arguments match directions;
//   - each block kind contains only its statements (see Stmt);
//   - exported blocks have the signature of their role (see Export);
//   - parser state graphs are well formed and select cases are constants of
//     the key types;
//   - tables with a ternary key require priorities; entries fit their keys;
//   - block calls form no cycle; extern instances match their types;
//   - the error list begins with core.p4's errors in the fixed order given
//     in docs/semantics.md.
//
// Field numbers 100 and above are reserved in every message for
// non-semantic annotations such as source positions, so that a reader can
// ignore them by number.

syntax = "proto3";

package p4blo.v0;

// ---------------------------------------------------------------------------
// Program
// ---------------------------------------------------------------------------

message Program {
  // Human-readable name; carries no meaning.
  string name = 1;
  // Error values by name. The first seven are core.p4's, in the order
  // NoError, PacketTooShort, NoMatch, StackOutOfBounds, HeaderTooShort,
  // ParserTimeout, ParserInvalidArgument. A program may add more.
  repeated string errors = 2;
  repeated HeaderType header_types = 3;
  repeated StructType struct_types = 4;
  repeated EnumType enum_types = 5;
  repeated ExternType extern_types = 6;
  // Extern instances are program-level state. A P4 block that owns extern
  // state and is instantiated more than once is elaborated into one block
  // per instantiation; the IR has no block instances.
  repeated ExternInstance extern_instances = 7;
  repeated Block blocks = 8;
  // The struct types of the headers value H and of the metadata value M.
  string headers = 9;
  string metadata = 10;
  // The blocks the program offers to an architecture, by role.
  repeated Export exports = 11;
  reserved 100 to 199;
}

// An architecture declares the roles it needs, each with a block kind; the
// program supplies a block per role. The check is structural: the role name
// is a label, and the block must have the calling convention of its kind:
//   parser:   (out H, inout M) over the packet
//   control:  (inout H, inout M)
//   deparser: (in H) over the packet
message Export {
  string role = 1;
  string block = 2;
}

// ---------------------------------------------------------------------------
// Types
// ---------------------------------------------------------------------------

message Type {
  oneof kind {
    // bit<N>, N >= 1.
    uint32 bits = 1;
    BoolType boolean = 2;
    // Name of a HeaderType.
    string header = 3;
    // Name of a StructType.
    string struct = 4;
    // Name of an EnumType.
    string enum_type = 5;
    ErrorType error = 6;
    StackType stack = 7;
  }
}

message BoolType {}

message ErrorType {}

// A header stack of `size` headers of type `header`.
message StackType {
  string header = 1;
  uint32 size = 2;
}

message Field {
  string name = 1;
  Type type = 2;
}

// Header fields are bits or boolean; varbit is out of scope.
message HeaderType {
  string name = 1;
  repeated Field fields = 2;
}

// Struct fields may be any type, including headers, structs and stacks.
message StructType {
  string name = 1;
  repeated Field fields = 2;
}

// A plain enum. Serializable enums are elaborated to bits and literals.
message EnumType {
  string name = 1;
  repeated string members = 2;
}

// ---------------------------------------------------------------------------
// Literals
// ---------------------------------------------------------------------------

message Literal {
  oneof value {
    BitsLiteral bits = 1;
    bool boolean = 2;
    EnumLiteral enum_member = 3;
    // A name from Program.errors.
    string error = 4;
  }
}

// A bit<width> value written in decimal, in [0, 2^width).
message BitsLiteral {
  uint32 width = 1;
  string value = 2;
}

message EnumLiteral {
  string enum_type = 1;
  string member = 2;
}

// ---------------------------------------------------------------------------
// Variables and parameters
// ---------------------------------------------------------------------------

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  // Directionless: action data.
  DIRECTION_NONE = 1;
  DIRECTION_IN = 2;
  DIRECTION_OUT = 3;
  DIRECTION_INOUT = 4;
}

message Var {
  string name = 1;
  Type type = 2;
}

message Param {
  string name = 1;
  Type type = 2;
  Direction direction = 3;
}

// ---------------------------------------------------------------------------
// Externs
// ---------------------------------------------------------------------------

// An extern type is monomorphic: every method has concrete parameter types.
// A P4 extern with type parameters is elaborated into one ExternType per
// distinct instantiation, named `family` or `family.suffix` (`register`,
// `register.16`); the part before the first dot is what an implementation
// binds to.
message ExternType {
  string name = 1;
  repeated Param constructor_params = 2;
  repeated Method methods = 3;
}

message Method {
  string name = 1;
  repeated Param params = 2;
  // Absent for a method that returns nothing.
  optional Type returns = 3;
}

message ExternInstance {
  string name = 1;
  string extern_type = 2;
  repeated Literal args = 3;
}

// ---------------------------------------------------------------------------
// Blocks
// ---------------------------------------------------------------------------

enum BlockKind {
  BLOCK_KIND_UNSPECIFIED = 0;
  BLOCK_KIND_PARSER = 1;
  BLOCK_KIND_CONTROL = 2;
  BLOCK_KIND_DEPARSER = 3;
}

// A block is a function. It performs no effects: it reads and writes its
// parameters, the packet when it is a parser or deparser, and the externs
// it calls, and nothing else. A parser has states and a start state and no
// body, actions or tables; a control or deparser has a body and no states.
message Block {
  string name = 1;
  BlockKind kind = 2;
  repeated Param params = 3;
  repeated Var locals = 4;
  repeated Action actions = 5;
  repeated Table tables = 6;
  repeated State states = 7;
  string start_state = 8;
  repeated Stmt body = 9;
  reserved 100 to 199;
}

message Action {
  string name = 1;
  // Directionless params are action data, supplied by table entries.
  repeated Param params = 2;
  repeated Stmt body = 3;
}

// ---------------------------------------------------------------------------
// Tables
// ---------------------------------------------------------------------------

enum MatchKind {
  MATCH_KIND_UNSPECIFIED = 0;
  MATCH_KIND_EXACT = 1;
  MATCH_KIND_LPM = 2;
  MATCH_KIND_TERNARY = 3;
}

// Keys are bits-typed; the frontend casts a boolean key and represents a
// plain enum key by its member index.
message Key {
  Expr expr = 1;
  MatchKind match_kind = 2;
  // The name the host uses for this key in entries; defaults to the
  // expression rendered as a dotted path when it is one.
  string name = 3;
}

message Table {
  string name = 1;
  repeated Key keys = 2;
  // Names of the actions an entry may invoke.
  repeated string actions = 3;
  // Runs on a miss. Absent means NoAction: do nothing.
  optional ActionCall default_action = 4;
  // A const default action cannot be changed by the host.
  bool const_default_action = 5;
  // Installed before any host entry and never removed.
  repeated Entry const_entries = 6;
  // Informative: the size hint P4 lets a table declare. No meaning.
  uint32 size = 7;
  reserved 100 to 199;
}

message ActionCall {
  string action = 1;
  repeated Literal args = 2;
}

message Entry {
  // One per table key, in order.
  repeated KeyValue keys = 1;
  ActionCall action = 2;
  // Only a table with a ternary key has priorities; larger wins, and 0 is
  // an ordinary priority. Entries of other tables leave it 0.
  uint32 priority = 3;
}

// Table keys are bits, so values are decimal of the key's width, and
// canonical: an lpm value has no set bit below its prefix and a ternary
// value none outside its mask.
message KeyValue {
  oneof kind {
    string exact = 1;
    LpmValue lpm = 2;
    TernaryValue ternary = 3;
  }
}

message LpmValue {
  string value = 1;
  uint32 prefix_len = 2;
}

message TernaryValue {
  string value = 1;
  string mask = 2;
}

// ---------------------------------------------------------------------------
// Parser states
// ---------------------------------------------------------------------------

message State {
  string name = 1;
  repeated Stmt body = 2;
  Transition transition = 3;
}

message Transition {
  oneof kind {
    Target direct = 1;
    Select select = 2;
  }
}

message Target {
  oneof kind {
    string state = 1;
    Accept accept = 2;
    Reject reject = 3;
  }
}

message Accept {}

message Reject {}

// Cases are tried in order; the first whose every key set matches wins.
// No match transitions to reject with error NoMatch.
message Select {
  repeated Expr keys = 1;
  repeated SelectCase cases = 2;
}

message SelectCase {
  // One per select key, in order.
  repeated KeySet sets = 1;
  Target target = 2;
}

message KeySet {
  oneof kind {
    Literal exact = 1;
    MaskedValue masked = 2;
    RangeValue range = 3;
    DontCare dont_care = 4;
  }
}

// Matches when (key & mask) == (value & mask).
message MaskedValue {
  Literal value = 1;
  Literal mask = 2;
}

// Matches when lo <= key <= hi.
message RangeValue {
  Literal lo = 1;
  Literal hi = 2;
}

message DontCare {}

// ---------------------------------------------------------------------------
// Statements
// ---------------------------------------------------------------------------

// Where each statement may appear:
//   any block:       assign, conditional, call_block, call_extern, set_valid,
//                    set_invalid, push, pop
//   control:         call_action; apply, but not inside an action
//   parser:          extract, advance, verify
//   deparser:        emit
message Stmt {
  oneof kind {
    Assign assign = 1;
    If conditional = 2;
    Apply apply = 3;
    CallAction call_action = 4;
    CallBlock call_block = 5;
    CallExtern call_extern = 6;
    SetValid set_valid = 7;
    SetInvalid set_invalid = 8;
    Push push = 9;
    Pop pop = 10;
    Extract extract = 11;
    Advance advance = 12;
    Verify verify = 13;
    Emit emit = 14;
  }
  reserved 100 to 199;
}

message Assign {
  LValue target = 1;
  Expr value = 2;
}

message If {
  Expr condition = 1;
  repeated Stmt then = 2;
  repeated Stmt otherwise = 3;
}

// Apply a table. `hit`, when present, receives whether an entry matched.
message Apply {
  string table = 1;
  optional LValue hit = 2;
}

message CallAction {
  string action = 1;
  repeated Arg args = 2;
}

// Call a sub-block of the caller's own kind: a parser may only call parsers,
// a control only controls and a deparser only deparsers, so a deparser, which
// runs without table entries, never reaches an `apply`. Not allowed inside
// an action.
message CallBlock {
  string block = 1;
  repeated Arg args = 2;
}

message CallExtern {
  string instance = 1;
  string method = 2;
  repeated Arg args = 3;
  // Receives the return value; present exactly when the method returns one.
  // The IR has no discarded results; the frontend introduces a local.
  optional LValue result = 4;
}

// An `in` argument is an expression; an `out` or `inout` argument is an
// lvalue, copied back after the call.
message Arg {
  oneof kind {
    Expr expr = 1;
    LValue lvalue = 2;
  }
}

message SetValid {
  LValue header = 1;
}

message SetInvalid {
  LValue header = 1;
}

message Push {
  LValue stack = 1;
  uint32 count = 2;
}

message Pop {
  LValue stack = 1;
  uint32 count = 2;
}

// Extract a fixed-size header from the packet into `target`.
message Extract {
  LValue target = 1;
}

// Skip `bits` bits of the packet.
message Advance {
  Expr bits = 1;
}

// Raise `error` unless `condition` holds.
message Verify {
  Expr condition = 1;
  string error = 2;
}

// Emit a header, or every header in a struct or stack, to the packet.
message Emit {
  Expr value = 1;
}

// ---------------------------------------------------------------------------
// Expressions
// ---------------------------------------------------------------------------

// Expressions carry no type annotations. Every leaf has a known type, every
// operator's result type is determined by its operands, and values carry
// their width at run time, so no interpreter infers anything.
message Expr {
  oneof kind {
    Literal literal = 1;
    // Name of a param or local visible here.
    string var = 2;
    Member member = 3;
    Index index = 4;
    LastIndex last_index = 5;
    Unary unary = 6;
    Binary binary = 7;
    Cast cast = 8;
    Slice slice = 9;
    IsValid is_valid = 10;
    Mux mux = 11;
    Lookahead lookahead = 12;
  }
  reserved 100 to 199;
}

// Field `field` of a header or struct.
message Member {
  Expr base = 1;
  string field = 2;
}

// Element `index` of a stack.
message Index {
  Expr base = 1;
  Expr index = 2;
}

// stack.lastIndex, a bit<32>.
message LastIndex {
  Expr stack = 1;
}

enum UnaryOp {
  UNARY_OP_UNSPECIFIED = 0;
  // Logical not, on boolean.
  UNARY_OP_NOT = 1;
  // Bitwise complement, on bits.
  UNARY_OP_COMPLEMENT = 2;
  // Two's complement negation modulo 2^N, on bits.
  UNARY_OP_NEGATE = 3;
}

message Unary {
  UnaryOp op = 1;
  Expr operand = 2;
}

enum BinaryOp {
  BINARY_OP_UNSPECIFIED = 0;
  // bits x bits -> bits, equal widths, wrapping.
  BINARY_OP_ADD = 1;
  BINARY_OP_SUB = 2;
  BINARY_OP_MUL = 3;
  // Saturating.
  BINARY_OP_ADD_SAT = 4;
  BINARY_OP_SUB_SAT = 5;
  BINARY_OP_BIT_AND = 6;
  BINARY_OP_BIT_OR = 7;
  BINARY_OP_BIT_XOR = 8;
  // bits x bits -> bits, left width; any right width.
  BINARY_OP_SHL = 9;
  BINARY_OP_SHR = 10;
  // bits x bits -> bits, width is the sum.
  BINARY_OP_CONCAT = 11;
  // any x any -> boolean, same type.
  BINARY_OP_EQ = 12;
  BINARY_OP_NE = 13;
  // bits x bits -> boolean, equal widths, unsigned.
  BINARY_OP_LT = 14;
  BINARY_OP_LE = 15;
  BINARY_OP_GT = 16;
  BINARY_OP_GE = 17;
  // boolean x boolean -> boolean, short-circuit.
  BINARY_OP_AND = 18;
  BINARY_OP_OR = 19;
}

message Binary {
  BinaryOp op = 1;
  Expr left = 2;
  Expr right = 3;
}

// Allowed: bits to bits of any width; boolean to bit<1>; bit<1> to boolean.
message Cast {
  Type to = 1;
  Expr operand = 2;
}

// operand[hi:lo], width hi - lo + 1, with lo <= hi < width(operand).
message Slice {
  Expr operand = 1;
  uint32 hi = 2;
  uint32 lo = 3;
}

message IsValid {
  Expr header = 1;
}

// condition ? then : otherwise, same type on both branches.
message Mux {
  Expr condition = 1;
  Expr then = 2;
  Expr otherwise = 3;
}

// Read a value of `type` from the packet without consuming it. Parser only.
message Lookahead {
  Type type = 1;
}

// ---------------------------------------------------------------------------
// Lvalues
// ---------------------------------------------------------------------------

message LValue {
  oneof kind {
    string var = 1;
    LMember member = 2;
    LIndex index = 3;
    // stack.next: parser only, the target of an extract into a stack.
    Next next = 4;
  }
}

message LMember {
  LValue base = 1;
  string field = 2;
}

message LIndex {
  LValue base = 1;
  Expr index = 2;
}

message Next {
  LValue stack = 1;
}

// ---------------------------------------------------------------------------
// Host-installed state
// ---------------------------------------------------------------------------

// What a host installs before packets run. Not part of a program.
message Entries {
  repeated TableEntries tables = 1;
}

message TableEntries {
  // The block and table names, since table names are block-scoped.
  string block = 1;
  string table = 2;
  repeated Entry entries = 3;
  // Overrides the program's default action unless it is const.
  optional ActionCall default_action = 4;
}
