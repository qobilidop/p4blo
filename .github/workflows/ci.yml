name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # cache-nix-action stores the Nix store in the Actions cache

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          gc-max-store-size-macos: 2G
      - name: Sync Python environment
        run: nix develop -c uv sync --locked
      - name: Lint
        run: nix develop -c uv run ruff check .
      - name: Format
        run: nix develop -c uv run ruff format --check .
      - name: Type check
        run: nix develop -c uv run pyright
      - name: Test
        run: nix develop -c uv run pytest

  schema:
    name: Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          gc-max-store-size-macos: 2G
      - name: Lint schema
        run: nix develop -c buf lint
      - name: Generated code is current
        run: |
          nix develop -c buf generate
          git diff --exit-code -- python/p4blo/v0
