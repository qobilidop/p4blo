name: Lean

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # cache-nix-action stores the Nix store in the Actions cache

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      # The flake provides elan, not Lean; elan downloads the toolchain that
      # lean/lean-toolchain pins into ~/.elan on first use. Cache it by that
      # pin so a toolchain bump is the only thing that re-downloads it.
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}
      - name: Install the pinned toolchain
        run: nix develop -c sh -c 'elan toolchain install "$(cat lean/lean-toolchain)"'
      - name: Build
        run: nix develop -c sh -c 'cd lean && lake build'
      - name: Test
        run: nix develop -c sh -c 'cd lean && lake test'
