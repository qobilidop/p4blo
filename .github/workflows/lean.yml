name: Lean

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write # cache-nix-action stores the Nix store in the Actions cache

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
  lean:
    needs: scope
    if: ${{ always() && !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.full != 'false') }}
    name: Lean (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      # The flake provides elan, not Lean; elan downloads the toolchain that
      # spec/ir/lean-toolchain pins into ~/.elan on first use. Cache it by that
      # pin so a toolchain bump is the only thing that re-downloads it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('spec/ir/lean-toolchain', 'spec/arch/lean-toolchain') }}
      - name: Install the pinned toolchain
        run: |
          # The $(cat) must expand in the inner shell, not here.
          # shellcheck disable=SC2016
          nix develop -c sh -c 'elan toolchain install "$(cat spec/ir/lean-toolchain)"'
      # Lake's compiled modules (`lib`, `ir`), not its linked executables
      # (`bin`, about 100 MB each), which relink in seconds. Lake checks every
      # restored module against its sources and rebuilds what changed, so a
      # PR restores main's latest build and compiles only its own changes.
      # Only main saves: the repository's Actions cache is at its size limit.
      - name: Restore the Lean build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            spec/ir/.lake/build/lib
            spec/ir/.lake/build/ir
            spec/arch/.lake/build/lib
            spec/arch/.lake/build/ir
          key: lean-build-${{ runner.os }}-${{ hashFiles('spec/ir/lean-toolchain') }}-${{ hashFiles('spec/**/*.lean', 'spec/*/lakefile.toml', 'spec/*/lake-manifest.json') }}
          restore-keys: lean-build-${{ runner.os }}-${{ hashFiles('spec/ir/lean-toolchain') }}-
      - name: Build, audit and test the two Lean packages
        run: nix develop -c scripts/check-lean.sh
      - name: Save the Lean build
        if: github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            spec/ir/.lake/build/lib
            spec/ir/.lake/build/ir
            spec/arch/.lake/build/lib
            spec/arch/.lake/build/ir
          key: lean-build-${{ runner.os }}-${{ hashFiles('spec/ir/lean-toolchain') }}-${{ hashFiles('spec/**/*.lean', 'spec/*/lakefile.toml', 'spec/*/lake-manifest.json') }}
      - name: Differential test against the Python reference
        env:
          P4BLO_REQUIRE_LEAN: "1"
        run: |
          nix develop -c uv sync --locked
          nix develop -c uv run pytest -k lean_agrees -v -n auto --dist load --ci-shard ${{ matrix.shard }}/2 --durations=20
      - name: Retain differential failure replays
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: differential-replays-${{ matrix.shard }}
          path: .artifacts/drt/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
