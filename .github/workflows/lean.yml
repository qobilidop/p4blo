name: Lean

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # cache-nix-action stores the Nix store in the Actions cache

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      # The flake provides elan, not Lean; elan downloads the toolchain that
      # spec/ir/lean-toolchain pins into ~/.elan on first use. Cache it by that
      # pin so a toolchain bump is the only thing that re-downloads it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('spec/ir/lean-toolchain', 'spec/arch/lean-toolchain', 'impl/lean/lean-toolchain') }}
      - name: Install the pinned toolchain
        run: |
          # The $(cat) must expand in the inner shell, not here.
          # shellcheck disable=SC2016
          nix develop -c sh -c 'elan toolchain install "$(cat spec/ir/lean-toolchain)"'
      - name: Build, audit and test the three Lean packages
        run: nix develop -c scripts/check-lean.sh
      - name: Differential test against the Python reference
        env:
          P4BLO_REQUIRE_LEAN: "1"
        run: |
          nix develop -c uv sync --locked
          nix develop -c uv run pytest tests -k lean_agrees -v
      - name: Retain differential failure replays
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: differential-replays
          path: .artifacts/drt/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
