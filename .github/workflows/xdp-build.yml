name: XDP compile profile

# Compilation, ELF/BTF metadata and negative tests only. No BPF load/attach.
on:
  push:
    branches: [main, work/xdp-build]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build pinned original without kernel capabilities
        run: docker build --progress=plain -t p4blo-xdp-build tests/oracle/xdp
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Require offline positive and negative checks
        run: nix develop -c uv run pytest tests/test_xdp_build.py -v
        env:
          P4BLO_REQUIRE_XDP_BUILD: "1"
      - name: Retain object provenance and corresponding sources
        if: always()
        run: |
          if ! docker image inspect p4blo-xdp-build > /dev/null 2>&1; then
            exit 0
          fi
          mkdir -p "$GITHUB_WORKSPACE/.artifacts"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges p4blo-xdp-build \
            tar -C /opt -cf - artifacts archives \
            > "$GITHUB_WORKSPACE/.artifacts/xdp-build.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: xdp-build-profile
          path: .artifacts/xdp-build.tar
          include-hidden-files: true
          retention-days: 14
