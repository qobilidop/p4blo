name: Oracle

# Claim 2: the corpus replays on P4-SpecTec's simulator. Separate from CI
# because the OCaml toolchain is heavy and only this job needs it
# (docs/design.md, "Testing strategy"). A red run here means either a
# divergence between the reference interpreter and the oracle, or an oracle
# that could not judge; tests/test_oracle.py labels which.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # cache-nix-action stores the Nix store in the Actions cache

jobs:
  oracle:
    name: P4-SpecTec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the pinned P4-SpecTec commit
        id: pin
        run: echo "commit=$(sed -n 's/^P4_SPECTEC_COMMIT=//p' tests/oracle/build.sh)" >> "$GITHUB_OUTPUT"
      # The checkout with its build tree and the opam root, keyed by the
      # pin and by the build script, since the script also fixes the package
      # set. On a hit tests/oracle/build.sh sees its stamp and returns at once.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/p4blo/p4-spectec
            ~/.opam
          key: oracle-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ hashFiles('tests/oracle/build.sh') }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      - name: Build the oracle in the pinned OCaml environment
        run: nix develop .#oracle -c tests/oracle/build.sh
      - name: Sync Python environment
        run: nix develop -c uv sync --locked
      - name: Replay the corpus on the oracle
        run: nix develop -c uv run pytest tests/test_oracle.py -v
      - name: Check CRC known answers and precise discrepancies
        run: nix develop -c uv run pytest tests/test_crc.py -k spectec -v
