name: Oracle

# Claim 2: the corpus replays on P4-SpecTec's simulator. Separate from CI
# because the OCaml toolchain is heavy and only this job needs it
# (docs/design.md, "Testing strategy"). A red run here means either a
# divergence between the reference interpreter and the oracle, or an oracle
# that could not judge; tests/test_oracle.py labels which.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # cache-nix-action stores the Nix store in the Actions cache

jobs:
  oracle:
    name: P4-SpecTec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned P4-SpecTec commit
        id: pin
        run: echo "commit=$(sed -n 's/^P4_SPECTEC_COMMIT=//p' oracle/build.sh)" >> "$GITHUB_OUTPUT"
      # The checkout with its build tree and the opam root, keyed by the
      # pin and by the build script, since the script also fixes the package
      # set. On a hit oracle/build.sh sees its stamp and returns at once.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/p4blo/p4-spectec
            ~/.opam
          key: oracle-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ hashFiles('oracle/build.sh') }}
      - name: Install opam and zarith's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev pkg-config
      - name: Build the oracle
        run: oracle/build.sh
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      - name: Sync Python environment
        run: nix develop -c uv sync --locked
      - name: Replay the corpus on the oracle
        run: nix develop -c uv run pytest tests/test_oracle.py -v
