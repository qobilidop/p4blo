# The reference architecture specification: the metadata contract, the
# switch, the extern families the supplied architectures provide, the
# execution-certificate example and the p4blo-lean conformance endpoint.
# Depends one way on the IR specification. Lean core only; no Mathlib.
#
# Layout: what a client may import lives under P4bloArch/; what only the
# gate runs (tests, the proof audit, fixtures) lives under P4bloArchTest/.
name = "p4blo-arch"
version = "0.1.0"
defaultTargets = ["P4bloArch", "p4blo-lean", "P4bloArchTest"]
testDriver = "archTests"

[[require]]
name = "p4blo-ir"
path = "../ir"

[[lean_lib]]
name = "P4bloArch"

# The pipe endpoint for differential testing: loads a program under the
# switch with the reference extern families and answers packet requests.
[[lean_exe]]
name = "p4blo-lean"
root = "Main"

# Every module under P4bloArchTest/, including the proof audit
# P4bloArchTest.ArchProofAudit, whose `#guard_msgs` pins are checked
# whenever this default target builds.
[[lean_lib]]
name = "P4bloArchTest"
globs = ["P4bloArchTest.+"]

# `lake test` runs this against ../ir/P4bloIRTest/forwarder.json and
# ../ir/P4bloIRTest/forwarder_vectors.json.
[[lean_exe]]
name = "archTests"
root = "P4bloArchTest.Main"
