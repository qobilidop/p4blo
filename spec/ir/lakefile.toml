# Authoritative IR syntax and semantics, wire adapter and scoped proofs.
# Independent of the architecture and user-facing packages, which depend on
# it. Lean core only; no Mathlib.
name = "p4blo-ir"
version = "0.1.0"
defaultTargets = ["P4bloIR", "ProofAudit", "CodecProofAudit", "codec-leaves"]
moreLeanArgs = ["-DwarningAsError=true"]
testDriver = "tests"

[[lean_lib]]
name = "P4bloIR"

[[lean_lib]]
name = "ProofAudit"

[[lean_lib]]
name = "CodecProofAudit"

# Test-only access to production leaf codecs without whole-program validation.
[[lean_exe]]
name = "codec-leaves"
root = "Tests.CodecLeaves"

# The test modules under Tests/, so that the test driver can import them.
[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

# `lake test` runs this against Tests/forwarder.json.
[[lean_exe]]
name = "tests"
root = "Tests.Main"
