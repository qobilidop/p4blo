# The user-facing Lean library over the IR and architecture specifications.
#
# Layout: what a client may import lives under P4blo/; Main.lean is the one
# executable root; what only the gate runs (the test driver and the proof
# audit) lives under P4bloTest/.
name = "p4blo"
version = "0.1.0"
defaultTargets = ["P4blo", "P4bloTest", "p4blo"]
moreLeanArgs = ["-DwarningAsError=true"]
testDriver = "userTests"

[[require]]
name = "p4blo-ir"
path = "../../spec/ir"

[[require]]
name = "p4blo-arch"
path = "../../spec/arch"

[[lean_lib]]
name = "P4blo"

# The application servers and test fixture exporters, as subcommands named
# after the separate executables they replace: `p4blo leanForwarder run`,
# `p4blo scalarExamples` and so on. Run it without arguments for the list.
[[lean_exe]]
name = "p4blo"
root = "Main"

# Every module under P4bloTest/, including the proof audit
# P4bloTest.UserProofAudit, whose `#guard_msgs` pins are checked whenever
# this default target builds.
[[lean_lib]]
name = "P4bloTest"
globs = ["P4bloTest.+"]

[[lean_exe]]
name = "userTests"
root = "P4bloTest.Main"
