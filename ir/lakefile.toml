# Authoritative IR syntax and semantics, wire adapter and conformance endpoint.
# Independent of the user-facing Lean package. Lean core only; no Mathlib.
name = "p4blo-ir"
version = "0.1.0"
defaultTargets = ["P4blo", "p4blo-lean", "ProofAudit"]
moreLeanArgs = ["-DwarningAsError=true"]
testDriver = "tests"

[[lean_lib]]
name = "P4blo"

[[lean_lib]]
name = "ProofAudit"

# The pipe endpoint for differential testing: reads a JSON program, decodes
# it, builds the index and prints a summary.
[[lean_exe]]
name = "p4blo-lean"
root = "Main"

# The test modules under Tests/, so that the test driver can import them.
[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

# `lake test` runs this against Tests/forwarder.json and
# Tests/forwarder_vectors.json.
[[lean_exe]]
name = "tests"
root = "Tests.Main"
